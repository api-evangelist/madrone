name: Madrone
description: >-
  Madrone is a data center cooling technology company (Y Combinator Spring 2026,
  NVIDIA Inception) building modular thermodynamic cooling systems that sit
  outside the data center and chill water to the dew point, eliminating the need
  for mechanical chillers and cooling towers. The company claims roughly 30% less
  power and water than a conventional chiller-plus-cooling-tower setup in Texas
  installations, freeing that power and capital for additional GPU compute. It is
  an early-stage hardware and infrastructure company with a sales-and-partnerships
  motion; as of this profiling it publishes no public API, developer portal, SDKs,
  documentation, or other machine-readable developer surface.
